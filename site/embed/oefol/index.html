<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Österreichische Meistertafel</title>
  <link rel="stylesheet" href="../../oefol/meistertafel.css?v=20261127-4">
  <link rel="stylesheet" href="embed.css?v=1">
  <script defer src="../../oefol/titles.js?v=20261127-3"></script>
  <script defer src="../../oefol/meistertafel.js?v=20261127-11"></script>
</head>
<body class="champions-embed" data-source-base="../../oefol/">
  <aside class="data-notice" id="data-notice" role="note" aria-label="Hinweis zum Datenstand">
    <button class="data-notice-close" id="data-notice-close" type="button" aria-label="Hinweis schließen" title="Schließen">×</button>
    <p>Die Daten der Meistertafel wurden automatisiert aufbereitet, Fehler sind möglich.
      Bitte gerne an <a href="mailto:josef.hilbert@icloud.com">josef.hilbert@icloud.com</a> rückmelden.</p>
  </aside>
  <div class="sticky-header">
    <div class="shell page-controls">
      <section class="filters" aria-label="Meistertafel filtern">
        <div class="filter-heading"><h2><button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="true" aria-controls="filter-grid"><svg class="filter-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h16l-6.3 7v4.2l-3.4 1.6V11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Filter</span><span id="filter-summary" class="filter-summary"></span><span class="filter-chevron" aria-hidden="true">▾</span></button></h2><button type="button" id="reset" class="reset">Filter zurücksetzen</button></div>
        <div class="filter-grid" id="filter-grid">
          <label>Jahr<select id="year"><option value="">Alle Jahre</option></select></label>
          <label>Disziplin<select id="discipline"><option value="">Alle Disziplinen</option></select></label>
          <label>Bewerb<select id="format"><option value="">Alle Bewerbe</option></select></label>
          <label>Titel<select id="title"><option value="">ÖM und ÖSTM</option><option value="ÖM">ÖM</option><option value="ÖSTM">ÖSTM</option></select></label>
          <label>Alterskategorie<select id="category"><option value="">Alle Kategorien</option></select></label>
          <label>Verein<select id="club"><option value="">Alle Vereine</option></select></label>
          <label class="search-label">Vor- oder Nachname<input id="search" type="search" autocomplete="off"></label>
        </div>
      </section>
      <nav class="view-switch" aria-label="Ansicht wählen">
        <button type="button" data-view="awards" aria-pressed="true">Meistertafel</button>
        <button type="button" data-view="people" aria-pressed="false">Läufer:innen</button>
        <button type="button" data-view="clubs" aria-pressed="false">Vereine</button>
      </nav>
    </div>
  </div>
  <main class="shell">
    <section class="results" aria-label="Meistertafel">
      <div id="error" class="notice" hidden></div>
      <div class="table-wrap"><table><thead id="table-head"></thead><tbody id="rows"></tbody></table></div>
      <p id="empty" hidden>Keine Einträge für diese Auswahl.</p><div id="load-sentinel" aria-hidden="true" hidden></div><button id="more" class="more" type="button" hidden>Weitere anzeigen</button>
    </section>
  </main>
</body>
</html>
